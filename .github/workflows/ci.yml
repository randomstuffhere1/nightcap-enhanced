name: CI

# The nightly workflow publishes on a push, so the CI workflow waits for a
# pull request instead of running a second time for the same commit.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'README.md'
      - '.gitmodules'
      - 'cmake/**'
      - 'config/**'
      - 'include/**'
      - 'packaging/**'
      - 'rust/**'
      - 'scripts/**'
      - 'src/**'
      - 'stubs/**'
      - 'tests/**'
      - 'third_party/**'
  workflow_dispatch:
    inputs:
      cache_action:
        description: 'Cache action'
        required: false
        type: choice
        options:
          - 'clear cache on workflow start'
          - 'clear cache then end workflow'
        default: ''
      ccache_ttl:
        description: 'CCache TTL in hours'
        required: false
        type: number
        default: 24

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Clear caches on workflow start
        if: github.event.inputs.cache_action == 'clear cache on workflow start' || github.event.inputs.cache_action == 'clear cache then end workflow'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ids="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | .id' || true)"
          for id in $ids; do
            [ -z "$id" ] && continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done
          echo "Cleared all caches at start"

      - name: End workflow after clearing cache
        if: github.event.inputs.cache_action == 'clear cache then end workflow'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "Cache cleared, ending workflow"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true
          exit 0

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        shell: bash
        # The managed payload contract test runs the Makefile under a stubbed
        # PATH, so the generator it picks depends on what the runner has here.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build

      - name: Validate shell and JSON files
        shell: bash
        run: |
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find config packaging/flatpak -type f -name '*.json' -print0 \
            | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Run script unit tests
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 -m unittest discover -s tests -p '*_test.py' -v

      - name: Build the Rust kernels from the vendored crates
        shell: bash
        working-directory: rust
        # rust-toolchain.toml picks the channel and rustup fetches it on demand.
        # Building here proves rust/vendor satisfies Cargo.lock with the network
        # off, which is the constraint every other build path relies on.
        run: cargo build --locked --offline

      - name: Verify build and packaging contracts
        shell: bash
        run: |
          bash tests/managed_payload_build_contract_test.sh .
          bash tests/flatpak_packaging_test.sh .
          bash tests/native_packaging_test.sh .
          bash tests/anylinux_dependencies_test.sh .

  native-build:
    name: Native build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      # The ccache action drops the older caches of its scope, which needs
      # the Actions permission.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    env:
      # CMake picks both up on its own (ccache becomes the compiler launcher,
      # mold wins over lld), so the workflows only have to install them.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      # The path of the source tree is part of the cache key, so it is made
      # relative to the checkout to keep the cache usable when the runner
      # hands the build a different directory.
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential binutils cmake git ninja-build pkg-config lld \
            libsdl3-dev libsdl3-ttf-dev libcurl4-openssl-dev libssl-dev \
            nlohmann-json3-dev libyaml-dev libelf-dev libminizip-dev \
            libcapstone-dev libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            libutf8proc-dev libfontconfig1-dev libegl-dev libvulkan-dev \
            libplacebo-dev libpng-dev zlib1g-dev \
            ccache mold \
            xvfb xauth libgl1-mesa-dri jq patchelf

      - name: Install the Rust toolchain
        shell: bash
        # cmake/MocktailRust.cmake builds rust/ with cargo --locked --offline, so
        # a toolchain is a build dependency here, not an optional extra.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore ccache
        uses: ./.github/actions/ccache
        with:
          scope: ccache-ci-${{ matrix.arch }}
          mode: restore
          ttl: ${{ github.event inputs.ccache_ttl }}

      - name: Build and check native executables
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-ci --parallel 4
          ./build-ci/mocktail --help
          ./build-ci/mocktail_updater status
          grep -q 'CMAKE_CXX_COMPILER_LAUNCHER:.*ccache' build-ci/CMakeCache.txt ||
            { echo "::error::ccache was not picked up as the compiler launcher"; exit 1; }
          grep -q 'MOCKTAIL_MOLD_PROGRAM' build-ci/CMakeCache.txt ||
            { echo "::error::mold was not detected"; exit 1; }
          ccache --show-stats | tail -5

      - name: Save ccache
        uses: ./.github/actions/ccache
        with:
          scope: ccache-ci-${{ matrix.arch }}
          mode: save

      - name: Run C++ and integration tests
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a ctest --test-dir build-ci --output-on-failure \
            --parallel 4 --timeout 120

      - name: Clear caches at end of workflow
        if: always() && github.event.inputs.cache_action == 'clear cache then end workflow'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ids="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | .id' || true)"
          for id in $ids; do
            [ -z "$id" ] && continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done
          echo "Cleared all caches at end"
