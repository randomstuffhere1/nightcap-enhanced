name: Nightly

# Rolling prerelease for people who would rather not build. One `nightly` tag
# carries every artifact from the same commit:
#
#   x86_64    AppImage (+ .zsync for appimageupdate), portable tarball,
#             pacman .pkg.tar.zst, .deb, .rpm
#   aarch64   .deb, .rpm
#
# The builds themselves live in build-packages.yml, shared with the tagged
# release; this workflow is the trigger, the tag, and the release notes.

on:
  push:
    # Every push to main publishes a new nightly. GitHub disables the
    # scheduled workflows of an inactive repository, so a cron trigger cannot
    # be relied on to keep the prerelease fresh.
    branches:
      - main
  workflow_dispatch:
    inputs:
      cache_action:
        description: 'Cache action'
        required: false
        type: choice
        options:
          - 'clear cache on workflow start'
          - 'clear cache then end workflow'
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TAG: nightly

jobs:
  probe:
    name: Check for new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Clear caches on workflow start
        if: github.event.inputs.cache_action == 'clear cache on workflow start' || github.event.inputs.cache_action == 'clear cache then end workflow'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ids="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | .id' || true)"
          for id in $ids; do
            [ -z "$id" ] && continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done
          echo "Cleared all caches at start"

      - name: End workflow after clearing cache
        if: github.event.inputs.cache_action == 'clear cache then end workflow'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "Cache cleared, ending workflow"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true
          exit 0

      - name: Compare HEAD against the published nightly tag
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)"
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${TAG}" \
            --jq '.assets | length' 2>/dev/null || true)"
          # A push whose commit already carries the nightly tag exits without
          # rebuilding. A manual run always builds, so the artifacts can be
          # rebuilt and republished without a new commit. So does a re-run of a
          # failed run, and so does a tag whose release is missing or has no
          # assets: in both cases the previous publication never finished, and
          # skipping would leave the nightly without its files forever.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$published" == "$GITHUB_SHA" &&
                "${GITHUB_RUN_ATTEMPT:-1}" -eq 1 && "${assets:-0}" -gt 0 ]]; then
            echo 'build=false' >>"$GITHUB_OUTPUT"
            echo "nightly already points at $GITHUB_SHA; nothing to build"
          else
            echo 'build=true' >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: probe
    if: needs.probe.outputs.build == 'true'
    uses: ./.github/workflows/build-packages.yml
    with:
      channel: nightly
      cache_action: ${{ inputs.cache_action }}
    permissions:
      contents: read
      # The ccache action drops the older caches of its scope, which needs
      # the Actions permission.
      actions: write

  publish:
    name: Publish nightly release
    needs: [probe, build]
    # A manual run from another branch still builds and smoke-tests, but the
    # nightly tag and release only ever follow main.
    if: needs.probe.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'Nightcap-*'
          merge-multiple: true
          path: release

      - name: Name and checksum the nightly build
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s release/Nightcap-x86_64.AppImage
          test -s release/Nightcap-x86_64.AppImage.zsync
          test -s release/Nightcap-x86_64-portable.tar.zst
          shopt -s nullglob
          # The nightly builds an amd64 and an arm64 .deb, and an x86_64 and an
          # aarch64 .rpm, so every pattern names one architecture. A generic
          # '*.deb' would match both and fail the count. The aarch64 legs
          # have no AppImage, tarball or pacman package, so the other two
          # artifacts are unique on their own.
          rename_one() {
            local glob="$1" name="$2" matched
            matched=(release/$glob)
            if [[ ${#matched[@]} -ne 1 ]]; then
              echo "::error::expected one ${glob} package, found ${#matched[@]}"
              exit 1
            fi
            mv -- "${matched[0]}" "release/$name"
          }
          rename_one '*.pkg.tar.zst' nightcap-nightly-x86_64.pkg.tar.zst
          rename_one '*amd64.deb' nightcap-nightly_amd64.deb
          rename_one '*arm64.deb' nightcap-nightly_arm64.deb
          rename_one '*x86_64.rpm' nightcap-nightly-x86_64.rpm
          rename_one '*aarch64.rpm' nightcap-nightly-aarch64.rpm
          (
            cd release
            # The zsync file carries its own signature format, so it is not
            # checksummed here. Every other asset gets a .sha256 beside it,
            # and SHA256SUMS lists them all.
            for asset in *; do
              case "$asset" in
                *.sha256|*.zsync) continue ;;
              esac
              sha256sum "$asset" >"$asset.sha256"
            done
            cat ./*.sha256 >SHA256SUMS
            ls -la
          )

      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          previous="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)"
          {
            printf 'Automated build of `main` at `%s` (%s).\n\n' \
              "${GITHUB_SHA:0:8}" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            # The subject of the commit this nightly was built from. It is
            # quoted rather than printed as a bullet so it reads as a heading
            # for the notes below; the commit body is left out on purpose.
            printf '> %s\n\n' "$(git log -1 --format='%s' "$GITHUB_SHA")"
            printf 'Untested and unreleased. Use a [tagged release](%s/releases) for normal play.\n\n' \
              "https://github.com/${GITHUB_REPOSITORY}"
            if [[ -n "$previous" && "$previous" != "$GITHUB_SHA" ]] && \
               git cat-file -e "${previous}^{commit}" 2>/dev/null; then
              printf '### Commits since the previous nightly\n\n'
              # -n rather than a pipe into head: head closing the pipe early
              # would kill git log with SIGPIPE, and pipefail would take the
              # whole step down with it.
              git log -n 60 --no-merges --format='- %s (`%h`)' \
                "${previous}..${GITHUB_SHA}"
              printf '\n'
            fi
            printf '### Unreleased changelog\n\n'
            # Changelog bullets are already "- " at column 0 and wrap with a
            # two-space indent, so only headings need rewriting and indented
            # lines have to stay as they are or they become their own bullets.
            # The awk stops itself after 60 lines for the same SIGPIPE reason.
            awk 'function emit(text) {
                   print text
                   if (++printed >= 60) exit
                 }
                 /^## \[Unreleased\]/{found=1; next}
                 /^## \[/{if (found) exit}
                 found && NF {
                   if ($0 ~ /^  /) { emit($0); next }
                   if ($0 ~ /^### /) { emit(sprintf("#### %s", substr($0, 5))); next }
                   emit($0)
                 }' CHANGELOG.md
            printf '\n### Install\n\n'
            cat <<'EOF'
          | Artifact | x86_64 | aarch64 |
          | --- | --- | --- |
          | AppImage | yes | no |
          | Portable tarball | yes | no |
          | pacman `.pkg.tar.zst` | yes | no |
          | `.deb` | yes | yes |
          | `.rpm` | yes | yes |

          aarch64 has no AppImage, tarball or pacman package yet: the portable
          packager is still x86-64 only, and Docker Hub dropped arm64 from the
          Arch base image.
          EOF
          } > nightly-notes.md
          cat nightly-notes.md

      - name: Update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          # A push triggers a run per commit, and the runs are queued rather
          # than run side by side. Only skip when the tag already carries a
          # descendant of this commit, since publishing then would roll the
          # nightly backwards. A diverged history (a rewritten branch, a merge
          # from upstream) is published: there is no newer build to protect.
          published="$(gh api "repos/${repo}/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)"
          if [[ -n "$published" && "$published" != "$GITHUB_SHA" ]] && \
             git cat-file -e "${published}^{commit}" 2>/dev/null && \
             git merge-base --is-ancestor "$GITHUB_SHA" "$published"; then
            echo "::notice::the ${TAG} tag already carries a newer commit (${published}); skipping"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}" --force

          # Everything below is idempotent: an existing tag, an existing
          # release and assets under the same names are all updated in place
          # instead of aborting the step. The release is created through the
          # API because `gh release create` refuses a tag that is already
          # there, and a single failed `gh release view` check must not stop
          # the upload.
          release="$(gh api "repos/${repo}/releases/tags/${TAG}" 2>/dev/null || true)"
          if ! jq -e '.id' >/dev/null 2>&1 <<<"$release"; then
            release="$(gh api -X POST "repos/${repo}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name='Nightcap nightly' \
              -f body="$(cat nightly-notes.md)" \
              -F prerelease=true \
              -F draft=false 2>/dev/null || true)"
            # A release another run created between the GET and the POST is
            # not an error: read it back and carry on.
            if ! jq -e '.id' >/dev/null 2>&1 <<<"$release"; then
              release="$(gh api "repos/${repo}/releases/tags/${TAG}")"
            fi
          fi
          gh api -X PATCH "repos/${repo}/releases/$(jq -r .id <<<"$release")" \
            -f name='Nightcap nightly' \
            -f body="$(cat nightly-notes.md)" \
            -F prerelease=true \
            -F draft=false >/dev/null

          # One asset per call, retried: the AppImage and the portable tarball
          # are hundreds of megabytes, and one transient 5xx used to abort the
          # step with the rest of the build unpublished. --clobber makes a
          # retried upload replace the partial asset.
          for asset in release/*; do
            [[ -e "$asset" ]] || continue
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" -R "$repo" --clobber; then
                break
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "::error::could not upload ${asset}"
                exit 1
              fi
              echo "::warning::upload of ${asset} failed; retrying"
              sleep 10
            done
          done
          # Drop assets left by earlier runs under other names.
          while IFS= read -r asset; do
            case "$asset" in
              SHA256SUMS|Nightcap-x86_64.AppImage|Nightcap-x86_64.AppImage.zsync|Nightcap-x86_64-portable.tar.zst|nightcap-nightly-x86_64.pkg.tar.zst|nightcap-nightly_amd64.deb|nightcap-nightly_arm64.deb|nightcap-nightly-x86_64.rpm|nightcap-nightly-aarch64.rpm|*.sha256)
                ;;
              *)
                gh release delete-asset "$TAG" "$asset" -R "$repo" --yes
                ;;
            esac
          done < <(gh release view "$TAG" -R "$repo" --json assets --jq '.assets[].name')
