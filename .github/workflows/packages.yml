name: Nightly

# Rolling prerelease for people who would rather not build. One `nightly` tag
# carries every artifact from the same commit:
#
#   x86_64    AppImage (+ .zsync for appimageupdate), portable tarball,
#             pacman .pkg.tar.zst, .deb, .rpm
#   aarch64   .deb, .rpm
#
# The builds themselves live in build-packages.yml, shared with the tagged
# release; this workflow is the trigger, the tag, and the release notes.

on:
  push:
    # Every push to main publishes a new nightly. GitHub disables the
    # scheduled workflows of an inactive repository, so a cron trigger cannot
    # be relied on to keep the prerelease fresh.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TAG: nightly

jobs:
  probe:
    name: Check for new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Compare HEAD against the published nightly tag
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)"
          # A push whose commit already carries the nightly tag exits without
          # rebuilding. A manual run always builds, so the artifacts can be
          # rebuilt and republished without a new commit.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$published" == "$GITHUB_SHA" ]]; then
            echo 'build=false' >>"$GITHUB_OUTPUT"
            echo "nightly already points at $GITHUB_SHA; nothing to build"
          else
            echo 'build=true' >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: probe
    if: needs.probe.outputs.build == 'true'
    uses: ./.github/workflows/build-packages.yml
    with:
      channel: nightly

  publish:
    name: Publish nightly release
    needs: [probe, build]
    # A manual run from another branch still builds and smoke-tests, but the
    # nightly tag and release only ever follow main.
    if: needs.probe.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'Nightcap-*'
          merge-multiple: true
          path: release

      - name: Name and checksum the nightly build
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s release/Nightcap-x86_64.AppImage
          test -s release/Nightcap-x86_64.AppImage.zsync
          test -s release/Nightcap-x86_64-portable.tar.zst
          shopt -s nullglob
          # The nightly builds an amd64 and an arm64 .deb, and an x86_64 and an
          # aarch64 .rpm, so every pattern names one architecture. A generic
          # '*.deb' would match both and fail the count. The aarch64 legs
          # have no AppImage, tarball or pacman package, so the other two
          # artifacts are unique on their own.
          rename_one() {
            local glob="$1" name="$2" matched
            matched=(release/$glob)
            if [[ ${#matched[@]} -ne 1 ]]; then
              echo "::error::expected one ${glob} package, found ${#matched[@]}"
              exit 1
            fi
            mv -- "${matched[0]}" "release/$name"
          }
          rename_one '*.pkg.tar.zst' nightcap-nightly-x86_64.pkg.tar.zst
          rename_one '*amd64.deb' nightcap-nightly_amd64.deb
          rename_one '*arm64.deb' nightcap-nightly_arm64.deb
          rename_one '*x86_64.rpm' nightcap-nightly-x86_64.rpm
          rename_one '*aarch64.rpm' nightcap-nightly-aarch64.rpm
          (
            cd release
            # The zsync file carries its own signature format, so it is not
            # checksummed here. Every other asset gets a .sha256 beside it,
            # and SHA256SUMS lists them all.
            for asset in *; do
              case "$asset" in
                *.sha256|*.zsync) continue ;;
              esac
              sha256sum "$asset" >"$asset.sha256"
            done
            cat ./*.sha256 >SHA256SUMS
            ls -la
          )

      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          previous="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)"
          {
            printf 'Automated build of `main` at `%s` (%s).\n\n' \
              "${GITHUB_SHA:0:8}" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'Untested and unreleased. Use a [tagged release](%s/releases) for normal play.\n\n' \
              "https://github.com/${GITHUB_REPOSITORY}"
            if [[ -n "$previous" && "$previous" != "$GITHUB_SHA" ]] && \
               git cat-file -e "${previous}^{commit}" 2>/dev/null; then
              printf '### Commits since the previous nightly\n\n'
              # -n rather than a pipe into head: head closing the pipe early
              # would kill git log with SIGPIPE, and pipefail would take the
              # whole step down with it.
              git log -n 60 --no-merges --format='- %s (`%h`)' \
                "${previous}..${GITHUB_SHA}"
              printf '\n'
            fi
            printf '### Unreleased changelog\n\n'
            # Changelog bullets are already "- " at column 0 and wrap with a
            # two-space indent, so only headings need rewriting and indented
            # lines have to stay as they are or they become their own bullets.
            # The awk stops itself after 60 lines for the same SIGPIPE reason.
            awk 'function emit(text) {
                   print text
                   if (++printed >= 60) exit
                 }
                 /^## \[Unreleased\]/{found=1; next}
                 /^## \[/{if (found) exit}
                 found && NF {
                   if ($0 ~ /^  /) { emit($0); next }
                   if ($0 ~ /^### /) { emit(sprintf("#### %s", substr($0, 5))); next }
                   emit($0)
                 }' CHANGELOG.md
            printf '\n### Install\n\n'
            cat <<'EOF'
          | Artifact | x86_64 | aarch64 |
          | --- | --- | --- |
          | AppImage | yes | no |
          | Portable tarball | yes | no |
          | pacman `.pkg.tar.zst` | yes | no |
          | `.deb` | yes | yes |
          | `.rpm` | yes | yes |

          aarch64 has no AppImage, tarball or pacman package yet: the portable
          packager is still x86-64 only, and Docker Hub dropped arm64 from the
          Arch base image.
          EOF
          } > release/notes.md
          cat release/notes.md

      - name: Update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # A push triggers a run per commit, and the runs are queued rather
          # than run side by side. If the tag already carries a newer commit,
          # publishing this build would roll the nightly backwards, so the run
          # stops here and leaves the newer build alone.
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${TAG}" \
            --jq .object.sha 2>/dev/null || true)"
          if [[ -n "$published" && "$published" != "$GITHUB_SHA" ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/${GITHUB_SHA}...${published}" \
              --jq .status 2>/dev/null || true)"
            if [[ "$status" == "behind" || "$status" == "diverged" ]]; then
              echo "::notice::the ${TAG} tag already carries a newer commit (${published}); skipping"
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}" --force
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease --target "$GITHUB_SHA" \
              --title "Nightcap nightly" \
              --notes-file release/notes.md
          fi
          gh release edit "$TAG" \
            --title "Nightcap nightly" \
            --notes-file release/notes.md
          gh release upload "$TAG" release/* --clobber
          # Drop assets left by earlier runs under other names.
          while IFS= read -r asset; do
            case "$asset" in
              SHA256SUMS|Nightcap-x86_64.AppImage|Nightcap-x86_64.AppImage.zsync|Nightcap-x86_64-portable.tar.zst|nightcap-nightly-x86_64.pkg.tar.zst|nightcap-nightly_amd64.deb|nightcap-nightly_arm64.deb|nightcap-nightly-x86_64.rpm|nightcap-nightly-aarch64.rpm|*.sha256)
                ;;
              *)
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
