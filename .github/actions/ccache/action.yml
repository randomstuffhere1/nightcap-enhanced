name: ccache
description: Share one ccache directory between the builds of a scope for a few hours.

# A build writes its ccache directory into the runner, and the runner goes
# away with the workflow. This action keeps the directory in the repository
# cache so the next build of the same scope starts warm instead of compiling
# the whole tree again.
#
# Each scope keeps one cache. The key carries the time the cache was written,
# so a cache that is older than the time to live is dropped rather than used,
# and the save step removes the older caches of the scope before it writes the
# new one, which keeps the repository cache quota for the other scopes.

inputs:
  scope:
    description: The cache scope, such as ccache-deb-x86_64.
    required: true
  mode:
    description: restore or save.
    required: true
  ttl:
    description: How many hours a cache stays usable.
    default: '6'
  path:
    description: The ccache directory.
    default: .ccache

runs:
  using: composite
  steps:
    - name: Stamp the run
      id: stamp
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "now=$(date -u +%s)" >>"$GITHUB_OUTPUT"

    - name: Restore the cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.path }}
        # This key never exists, so the restore always takes the newest cache
        # of the scope through the prefix below.
        key: ${{ inputs.scope }}-${{ steps.stamp.outputs.now }}
        restore-keys: |
          ${{ inputs.scope }}-

    - name: Drop a cache that is too old
      if: inputs.mode == 'restore'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCOPE: ${{ inputs.scope }}
        TTL_HOURS: ${{ inputs.ttl }}
        NOW: ${{ steps.stamp.outputs.now }}
        CACHE_DIR: ${{ inputs.path }}
      # The cache bookkeeping must never fail a build.
      continue-on-error: true
      run: |
        set -Eeuo pipefail
        # The newest cache of the scope is the one the restore took. Its key
        # carries the time it was written, so its age is known without
        # trusting the output of the restore step.
        keys="$(gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          --jq ".actions_caches[] | select(.key | startswith(\"${SCOPE}-\")) | .key")"
        key="${keys%%$'\n'*}"
        if [[ -z "$key" ]]; then
          echo "no cache of ${SCOPE} to check"
          exit 0
        fi
        stamp="${key##*-}"
        if [[ ! "$stamp" =~ ^[0-9]+$ ]]; then
          echo "::warning::the cache ${key} carries no time; keeping it"
          exit 0
        fi
        age_hours=$(( (NOW - stamp) / 3600 ))
        if (( age_hours >= TTL_HOURS )); then
          echo "::notice::the cache ${key} is ${age_hours}h old; dropping it"
          rm -rf -- "$CACHE_DIR"
        fi

    - name: Drop the older caches of the scope
      if: inputs.mode == 'save'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCOPE: ${{ inputs.scope }}
      # The cache bookkeeping must never fail a build.
      continue-on-error: true
      run: |
        set -Eeuo pipefail
        # The newest cache holds everything the older ones held, so one entry
        # per scope is enough and the quota stays free for the other scopes.
        ids="$(gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          --jq ".actions_caches[] | select(.key | startswith(\"${SCOPE}-\")) | .id")"
        for id in $ids; do
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null
        done

    - name: Save the cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      continue-on-error: true
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.scope }}-${{ steps.stamp.outputs.now }}
