# Modified by vii from komaruworld/mocktail. See README "About this fork".
# Mocktail configuration.
# The file is created once with mode 0600. Mocktail never replaces your edits.

# Integer: configuration schema version. Only version 1 is supported.
version: 1

# One-line device preset. Short aliases pc, mobile, and console are accepted.
# Presets: pc-windows-11, mobile-pixel-7, console-ps5.
# Use the mapping below for a custom profile.
device: pc-windows-11

# Detailed alternative (replace the scalar device line above):
# device:
#   type: mobile
#   platform: Android
#   name: Google Pixel 9 Pro
#   manufacturer: Google
#   model: Pixel 9 Pro
#   brand: google
#   code: komodo
#   sku: pixel-9-pro
#   soc_model: Google Tensor G4
#   touch: true
#   mouse: false
#   keyboard: false

runtime:
  # Boolean (default: false): start without a visible SDL window.
  headless: false
  # String (optional): use a specific x86_64 libroblox.so instead of the
  # active verified payload.
  # roblox_library: /absolute/path/to/libroblox.so

appearance:
  # String (default: roblox): use Roblox's saved account theme. Supported
  # overrides: dark, light, or system (follow the desktop color scheme).
  theme: roblox

graphics:
  # String (default: direct-vulkan): graphics backend. Use opengl on hardware
  # without a working Vulkan driver; OpenGL ES 3.0 or newer is required.
  # Recommended values: direct-vulkan, opengl, system, angle-vulkan.
  backend: direct-vulkan
  # Optional string or integer: Mocktail frame-rate override. Leave commented
  # (or use -1) to let Roblox Basic Settings own the cap. Supported overrides:
  # display, unlimited, or any positive integer. Values up to 240 are forwarded
  # to DFIntTaskSchedulerTargetFps; unlimited and higher values set FramerateCap
  # in Roblox's own settings, since Roblox stops the scheduler flag at 240.
  # frame_rate_limit: -1
  # Optional presentation synchronization override: auto, on, or off. auto
  # presents through the lowest-latency synchronized mode the driver offers
  # unless frame_rate_limit is unlimited.
  # vsync: off
  #
  # String (default: on): keep a fallback copy of the driver's pipeline cache.
  # The Roblox client already persists its own shadercachevk.bin and passes it
  # to the driver, so on a stock client this does nothing and the setting only
  # matters for a client that stops doing that. Set to clear to discard the
  # stored copy and run the next session uncached, or to off to never read or
  # write one. See docs/PERFORMANCE.md before blaming shaders for a stutter.
  # pipeline_cache: on
  # String (default: auto): Roblox's own graphics quality level, 1 to 6. auto
  # leaves the level to the client. A number overrides the value the
  # multithreaded path would otherwise force, and is the only way to get a
  # level other than that path's choice.
  # quality: auto

performance:
  # Boolean (default: false): size Roblox scheduler/render queues from every
  # physical CPU core. A place's Lua/main thread can still remain serial.
  multithreaded_rendering: false
  # String (default: throughput): `throughput` makes every physical core
  # available to Roblox worker pools; `latency` preserves Roblox-managed pool
  # sizes and coalesces midphase work. Supported: auto, latency, throughput.
  physics_worker_mode: throughput
  # Integer MiB (default: 0): hard RAM cap for the Mocktail process tree.
  # 0 disables the cap. cgroup v2 also disables swap; other Linux systems use
  # an RSS+swap watchdog. 6144 is a conservative starting point for 32 GiB RAM.
  memory_limit_mb: 0
  # String (default: auto): request Feral GameMode when its host daemon and
  # client library are available. Supported values: auto, on, off.
  gamemode: auto
  # Boolean (default: false): launch with MANGOHUD=1 so the MangoHud overlay
  # draws over the game. MangoHud must be installed on the host.
  mangohud: false
  # Integer MiB (default: 0): texture memory budget to tell Roblox, overriding
  # the automatic eighth-of-host-RAM figure. 0 keeps the automatic value, which
  # is capped at 1536 and is usually right. Raise it if a heavy place reuploads
  # textures it should be keeping; lower it on a small GPU. The resolved budget
  # is printed at startup. 2047 is the practical maximum, because the client
  # reads the budget through a signed 32-bit setting.
  # texture_memory_mb: 0
  # Integer (default: 4): redraw ETC2 textures of 64px or smaller at N times
  # their size, so small mobile textures are not blurry on a desktop display.
  # 1 turns it off. Higher values cost GPU memory and sampling bandwidth on
  # every frame that uses an affected texture. Only affects experiences that
  # upload compressed textures at all.
  # small_texture_upscale: 4

audio:
  # String (default: default): `default` follows the host system output.
  # To pin output, copy an exact SDL device name printed during startup.
  output_device: default
  # String (default: default): input device name, `id:<number>` printed during
  # startup, or `disabled`. IDs disambiguate duplicate names but may change
  # between boots; prefer the exact device name when it is unique.
  input_device: default
  # Integer frames (default: 0): intended playback buffer size. 0 accepts
  # whatever the device uses, which is right in most cases; lower values cut
  # audio latency and raise the chance of a dropout, higher values are steadier
  # and laggier. SDL3 does not expose a way to set this per device, so the
  # value is advisory: startup reports the size actually in use and explains
  # that SDL_AUDIO_BUFFER_SAMPLES is the supported way to change it. Set this
  # to a non-zero value to have Nightcap say so at startup. The session also
  # logs a starved-refill count at exit, which is what tells you the size in
  # use is too small.
  # buffer_samples: 0

input:
  # Boolean (default: false): send mouse look deltas in the host's own units.
  # They are otherwise scaled by the window's pixel density divided by the
  # desktop display scale, which cancels to 1.0 unless fractional scaling makes
  # the two disagree. Turn this on when first-person aiming feels too slow or
  # too fast under fractional scaling. The pointer position is unaffected.
  raw_mouse: false
  # Boolean (default: false): use the desktop's cursor theme for the arrow,
  # hand and text cursors instead of Roblox's pictures.
  system_cursor: false
  # Boolean (default: false): have the desktop draw the cursor instead of
  # Roblox drawing it into the game, so cursor effects and tools work with it.
  # Uses Roblox's pictures, a game's own cursor included. The shift lock
  # cursor is still drawn by Roblox.
  hardware_cursor: false
  # Integer Hz (default: 240, 60-360): how often Nightcap checks for mouse and
  # keyboard events. 240 matches Roblox's highest scheduler frame rate, so it
  # keeps up with the fastest frames the client reports. Lower values free CPU
  # time; raise it only for a display and game that run above 240 FPS.
  pump_hz: 240

overlay:
  # Boolean (default: false): show the game server's location for a few
  # seconds after each join, at the top center. Looks the server up at
  # ipinfo.io only while this is on.
  location: false
  # Integer (default: 12, 0-200): the location popup's distance from the top,
  # in pixels. 12 lines it up with Roblox's top bar.
  location_offset: 12
  # Booleans (default: false): keep the frame rate and ping on screen in game.
  fps: false
  ping: false
  # String (default: bottom_left): where the frame rate and ping go:
  # top_center, top_right, bottom_left, bottom_center, or bottom_right.
  position: bottom_left

integrations:
  fleasion:
    # Boolean (default: false): trust Fleasion's CA without editing Roblox files.
    enabled: false
    # String: match Fleasion's routing mode: env or hosts.
    proxy_mode: env
    # Integer: Fleasion's local HTTP proxy port in env mode.
    proxy_port: 58443
    # Boolean (default: false): clear Roblox's downloaded game assets at each
    # launch so Fleasion's replacements load. Settings and sign-in are kept.
    clear_cache_on_launch: false
    # Optional absolute public CA path. Default: $XDG_CONFIG_HOME/Fleasion/proxy_ca/ca.crt
    # or ~/.config/Fleasion/proxy_ca/ca.crt. Never select ca.key.
    # ca_certificate: /home/user/.config/Fleasion/proxy_ca/ca.crt
  discord_rpc:
    # Boolean (default: true): publish Nightcap activity to Discord Desktop.
    # This never signs in to Discord and never reads an account token.
    enabled: true
    # Boolean (default: true): show the current Roblox experience name.
    show_place_name: true
    # Boolean (default: true): show how long the current session has run.
    show_elapsed_time: true
    join:
      # Boolean (default: true): let friends open the current experience. When
      # Roblox provides a public server ID, the button targets that server.
      enabled: true
      # Boolean (default: true): never expose private or reserved joins.
      public_servers_only: true
      # button_label: Join Server
    # English defaults. Uncomment only the lines you want to customize.
    # Text and image fields accept {place_name}, {place_icon}, and
    # {creator_name}. A field that expands an empty placeholder is left out,
    # and a "" title shows the app name.
    # title, state, and the images fields may be "" to hide them.
    # text:
    #   browsing: Browsing experiences
    #   joining: Joining an experience
    #   playing: "Playing {place_name}"
    #   state: "by {creator_name}"
    #   unknown_place: Unknown experience
    #   title: Roblox
    # Images take an https:// URL, or an asset key uploaded to application_id.
    # large: "" hides both images; the small image needs a large one.
    # images:
    #   large: "{place_icon}"
    #   large_text: "{place_name}"
    #   small: roblox_small
    #   small_text: Roblox
    # Advanced: overrides the application bundled by the package maintainer.
    # application_id: 123456789012345678

window:
  # Integer (default: 1280): initial window width in logical desktop units.
  width: 1280
  # Integer (default: 720): initial window height in logical desktop units.
  height: 720
  # String (default: Roblox): window title.
  title: Roblox
  # Boolean (default: false): render at physical display-pixel density instead
  # of the logical desktop resolution. Enable only for sharper high-DPI output.
  high_dpi: false
  # Boolean (default: false): close Nightcap when you leave an experience,
  # instead of staying open on the Roblox home screen.
  close_on_leave: false
  # Boolean (default: false): use a native display mode in fullscreen instead
  # of the compositor's borderless path. Exclusive fullscreen can cut input
  # latency on X11 by bypassing the compositor, at the cost of a display mode
  # switch and a slower alt-tab. Wayland has no exclusive fullscreen, so it
  # stays borderless.
  exclusive_fullscreen: false

network:
  # Boolean (default: false): follow the host HTTP/SOCKS5 proxy and
  # automatically use its current port. Do not combine with a fixed proxy.
  use_system_proxy: false
  # Optional fixed HTTP/SOCKS5 proxy. Uncomment host and port together.
  # The host must not contain a scheme such as http://.
  # proxy_scheme: http
  # String (optional, default: disabled): proxy host name or IP address.
  # proxy_host: 127.0.0.1
  # Integer (optional, default: disabled): proxy TCP port from 1 to 65535.
  # proxy_port: 8080
  # proxy_username: "user"
  # proxy_password: "password"
  # Absolute path (optional): custom PEM CA bundle. Mocktail reads this file
  # directly and does not replace it during Roblox payload updates.
  # ca_bundle: /home/user/.config/mocktail/cacert.pem

updates:
  # Boolean (default: true): check the latest Roblox version, derive an exact
  # HostAbi profile, run two isolated canaries with the selected graphics
  # backend, and promote only on success. An existing current payload is
  # preserved when probation fails.
  automatic: true
  # Integer (default: 6): how long a successful "latest Roblox version" answer
  # stays usable, in hours. Inside that window a launch reuses the recorded
  # answer instead of waiting on a network round-trip, which is most of what
  # the startup preflight costs. 0 asks the provider on every launch. The
  # trade is that a newly published Roblox build can take up to this long to be
  # noticed automatically; `make update-auto` and
  # `mocktail_updater update --force-run-latest` check immediately.
  check_interval_hours: 6
  # Boolean (default: false): when false, a launch skips re-hashing a payload
  # whose libroblox.so is byte-identical to what was already verified (same
  # size, inode, and modification time). Set true to re-hash the 118 MiB
  # library on every launch. Either way, staging, promoting, and rolling back a
  # payload always hash everything in full.
  reverify_library_on_launch: false
  # String (default: apk-pure): direct x86_64 APK provider selection. Both
  # accepted values resolve the provider chain, which currently starts with
  # APKPure. Supported values: auto, apk-pure.
  source: apk-pure
  # Reserved for desktop update integrations. `mocktail_updater` itself never
  # launches another process after changing the active payload.
  launch_after_update: false
